name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Audit public source
        shell: pwsh
        run: ./scripts/verify-public-source.ps1
      - name: Build and run isolated contracts
        run: ./gradlew --no-daemon clean build runContracts
      - name: Verify runtime identity and source-set boundary
        shell: bash
        run: |
          set -euo pipefail
          runtime='build/libs/SEAC-SlashBlade-Old-Dream-Reforged-1.21.1-0.1.0-dev.10.jar'
          sources='build/libs/SEAC-SlashBlade-Old-Dream-Reforged-1.21.1-0.1.0-dev.10-sources.jar'
          test -f "${runtime}"
          echo '1e156254291e2db91317a4d34b153d19e6e77440de844969d0804f1c4eb1d2aa  '"${runtime}" | sha256sum -c -
          echo 'c4c04b58744e2a7dfdc67e01adc2c06b05a033004ab0fd1b0f700e9bbb4dde48  '"${sources}" | sha256sum -c -
          jar tf "${runtime}" > "${RUNNER_TEMP}/seac-slashblade-runtime-entries.txt"
          if grep -q '^org/scex/slashbladelegacy/contracts/' "${RUNNER_TEMP}/seac-slashblade-runtime-entries.txt"; then
            echo 'Development contract harness leaked into the runtime JAR.' >&2
            exit 1
          fi
          unzip -p "${runtime}" META-INF/neoforge.mods.toml | grep -F 'displayName="SEAC拔刀剑附属 旧梦重铸"'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: seac-slashblade-old-dream-reforged-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
