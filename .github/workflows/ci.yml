name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Audit public source
        shell: pwsh
        run: ./scripts/verify-public-source.ps1
      - name: Build and run isolated contracts
        run: ./gradlew --no-daemon clean build runContracts
      - name: Verify runtime identity and source-set boundary
        shell: bash
        run: |
          set -euo pipefail
          runtime='build/libs/SEAC-SlashBlade-Old-Dream-Reforged-1.21.1-0.2.0-dev.1.jar'
          sources='build/libs/SEAC-SlashBlade-Old-Dream-Reforged-1.21.1-0.2.0-dev.1-sources.jar'
          test -f "${runtime}"
          echo '9672686341614536dc2b09da694e3981fc4d000c22c909c9ab53afa2d20506c8  '"${runtime}" | sha256sum -c -
          echo '9cefab5c43799a5d9d15664457a0021d14f60579c003d48ab3ca9284b0963e47  '"${sources}" | sha256sum -c -
          jar tf "${runtime}" > "${RUNNER_TEMP}/seac-slashblade-runtime-entries.txt"
          if grep -q '^org/scex/slashbladelegacy/contracts/' "${RUNNER_TEMP}/seac-slashblade-runtime-entries.txt"; then
            echo 'Development contract harness leaked into the runtime JAR.' >&2
            exit 1
          fi
          unzip -p "${runtime}" META-INF/neoforge.mods.toml | grep -F 'displayName="SEAC拔刀剑附属 旧梦重铸"'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: seac-slashblade-old-dream-reforged-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
