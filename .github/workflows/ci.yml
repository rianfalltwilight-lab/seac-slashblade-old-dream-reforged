name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: minecraft-1.21.1-neoforge
            project: .
            artifacts: build/libs/SEAC-SlashBlade-Old-Dream-Reforged-1.21.1-*.jar
          - target: minecraft-1.20.1-forge
            project: ports/1.20.1
            artifacts: ports/1.20.1/build/forge/libs/slashblade-legacy-compat-forge-1.20.1-*.jar
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java toolchains
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - name: Audit public source
        shell: pwsh
        run: ./scripts/verify-public-source.ps1
      - name: Prepare Forge dependency
        if: matrix.project == 'ports/1.20.1'
        shell: pwsh
        run: ./ports/1.20.1/prepare-dependencies.ps1
      - name: Build and check
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [[ '${{ matrix.project }}' == '.' ]]; then
            ./gradlew --no-daemon build runContracts --max-workers=2
          else
            ./gradlew --no-daemon build contractsProbeJar persistenceProbeJar -Ploader=forge --max-workers=2
          fi
      - name: Verify player JAR excludes probes
        shell: bash
        run: |
          set -euo pipefail
          project='${{ matrix.project }}'
          version="$(sed -n "s/^version = '\([^']*\)'/\1/p" "$project/build.gradle")"
          if [[ "$project" == '.' ]]; then
            runtime="build/libs/SEAC-SlashBlade-Old-Dream-Reforged-1.21.1-$version.jar"
          else
            runtime="$project/build/forge/libs/slashblade-legacy-compat-forge-1.20.1-$version.jar"
          fi
          test -f "$runtime"
          jar --validate --file "$runtime"
          jar tf "$runtime" > "$RUNNER_TEMP/runtime-entries.txt"
          if grep -q '^org/scex/slashbladelegacy/contracts/' "$RUNNER_TEMP/runtime-entries.txt"; then
            echo 'Contract probe classes leaked into the player JAR.' >&2
            exit 1
          fi
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}-${{ github.sha }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error