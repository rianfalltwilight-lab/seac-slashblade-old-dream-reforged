name: Publish prerelease

on:
  push:
    tags:
      - 'v*'
      - 'mc1.20.1-forge-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release.outputs.exists }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check for an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists; keeping its verified assets."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - name: Audit public source
        shell: pwsh
        run: ./scripts/verify-public-source.ps1
      - name: Select release target
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            mc1.20.1-forge-v*)
              project='ports/1.20.1'
              version="${RELEASE_TAG#mc1.20.1-forge-v}"
              prefix="slashblade-legacy-compat-forge-1.20.1-$version"
              libdir="$project/build/forge/libs"
              notes="docs/releases/mc1.20.1-forge-$version.md"
              ;;
            v*)
              project='.'
              version="${RELEASE_TAG#v}"
              prefix="SEAC-SlashBlade-Old-Dream-Reforged-1.21.1-$version"
              libdir='build/libs'
              notes="docs/releases/$version.md"
              ;;
            *) echo 'Unsupported release tag.' >&2; exit 1 ;;
          esac
          build_version="$(sed -n "s/^version = '\([^']*\)'/\1/p" "$project/build.gradle")"
          test "$version" = "$build_version"
          test -f "$notes"
          printf '%s\n' "PROJECT=$project" "VERSION=$version" "PREFIX=$prefix" "LIBDIR=$libdir" "NOTES=$notes" "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Prepare Forge dependency
        if: env.PROJECT == 'ports/1.20.1'
        shell: pwsh
        run: ./ports/1.20.1/prepare-dependencies.ps1
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          chmod +x ./gradlew
          if [[ "$PROJECT" == '.' ]]; then
            ./gradlew --no-daemon build runContracts --max-workers=2
          else
            ./gradlew --no-daemon build contractsProbeJar persistenceProbeJar -Ploader=forge --max-workers=2
          fi
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          out='build/public-release'
          mkdir -p "$out"
          cp "$LIBDIR/$PREFIX.jar" "$LIBDIR/$PREFIX-sources.jar" "$out/"
          jar tf "$out/$PREFIX.jar" > "$RUNNER_TEMP/runtime-entries.txt"
          if grep -q '^org/scex/slashbladelegacy/contracts/' "$RUNNER_TEMP/runtime-entries.txt"; then
            echo 'Contract probe classes leaked into the player JAR.' >&2
            exit 1
          fi
          git archive --format=zip --prefix="$PREFIX-source/" --output="$out/$PREFIX-source.zip" HEAD
          jq -n --arg tag "$RELEASE_TAG" --arg version "$VERSION" --arg project "$PROJECT" --arg commit "$(git rev-parse HEAD)" --arg runtime "$(sha256sum "$out/$PREFIX.jar" | cut -d' ' -f1)" --arg sources "$(sha256sum "$out/$PREFIX-sources.jar" | cut -d' ' -f1)" --arg sourceZip "$(sha256sum "$out/$PREFIX-source.zip" | cut -d' ' -f1)" '{tag:$tag,version:$version,sourceProject:$project,sourceCommit:$commit,publishedRuntimeSha256:$runtime,sourcesJarSha256:$sources,sourceZipSha256:$sourceZip,validation:{build:true,rootIntegrationContracts:($project=="."),interactiveClient:false,production:false}}' > "$out/release-manifest.json"
          (cd "$out" && sha256sum "$PREFIX.jar" "$PREFIX-sources.jar" "$PREFIX-source.zip" release-manifest.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: build/public-release/*
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$RELEASE_TAG" build/public-release/* --verify-tag --prerelease --title "旧梦重铸 $RELEASE_TAG" --notes-file "$NOTES"