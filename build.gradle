plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}
version = '0.3.0-dev.1'
group = 'org.scex'
base { archivesName = 'SEAC-SlashBlade-Old-Dream-Reforged-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

tasks.register('clientProbeJar', Jar) {
    archiveClassifier = 'client-probe'
    from(sourceSets.contracts.output) { exclude 'org/scex/slashbladelegacy/contracts/LegacyPersistenceProbe*.class' }
}
tasks.register('serverContractsJar', Jar) {
    archiveClassifier = 'server-contracts-r3'
    from(sourceSets.contracts.output) {
        exclude 'org/scex/slashbladelegacy/contracts/LegacyClientProbe*.class'
        exclude 'org/scex/slashbladelegacy/contracts/LegacyViewProbe*.class'
        exclude 'org/scex/slashbladelegacy/contracts/LegacyTimingTrace*.class'
        exclude 'org/scex/slashbladelegacy/contracts/LegacyLifecycleProbe*.class'
        exclude 'org/scex/slashbladelegacy/contracts/LegacyDamageProbe*.class'
        exclude 'org/scex/slashbladelegacy/contracts/LegacyPersistenceProbe*.class'
    }
}
tasks.register('persistenceProbeJar', Jar) {
    archiveClassifier = 'persistence-probe-r1'
    from(sourceSets.persistence.output)
    from 'src/persistenceResources'
}
sourceSets { contracts; persistence }
configurations {
    contractsImplementation.extendsFrom implementation
    contractsRuntimeOnly.extendsFrom runtimeOnly
    persistenceImplementation.extendsFrom implementation
    persistenceRuntimeOnly.extendsFrom runtimeOnly
    slashbladeVerification {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
sourceSets.persistence.compileClasspath += sourceSets.main.output
sourceSets.persistence.runtimeClasspath += sourceSets.main.output
sourceSets.contracts.compileClasspath += sourceSets.main.output
sourceSets.contracts.runtimeClasspath += sourceSets.main.output
neoForge {
    version = providers.gradleProperty('neoForgeVersion').getOrElse('21.1.248')
    addModdingDependenciesTo(sourceSets.contracts)
    addModdingDependenciesTo(sourceSets.persistence)
    runs {
        client { client(); gameDirectory = file('runs/client') }
        server { server(); gameDirectory = file('runs/server') }
        contracts {
            server(); sourceSet = sourceSets.contracts
            gameDirectory = file(providers.gradleProperty('contractGameDir').getOrElse('runs/contracts'))
            jvmArgument '-Xmx4G'
            jvmArgument '-XX:ActiveProcessorCount=2'
            jvmArgument '-Dscex.legacy17Contracts=true'
        }
    }
    mods {
        slashblade_legacy_compat { sourceSet sourceSets.main }
        slashblade_legacy_contracts { sourceSet sourceSets.contracts }
    }
}
neoForge.runs.client.loadedMods = [neoForge.mods.slashblade_legacy_compat]
neoForge.runs.server.loadedMods = [neoForge.mods.slashblade_legacy_compat]
tasks.named('runContracts') {
    doFirst {
        def gameDir = file(providers.gradleProperty('contractGameDir').getOrElse('runs/contracts'))
        gameDir.mkdirs()
        new File(gameDir, 'eula.txt').text = 'eula=true\n'
        new File(gameDir, 'server.properties').text = '''\
allow-flight=true
enable-command-block=true
generate-structures=false
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","structures":{}}
level-name=world
level-type=minecraft:flat
max-players=1
motd=SEAC SlashBlade isolated contracts
online-mode=false
server-ip=127.0.0.1
server-port=25791
simulation-distance=4
spawn-protection=0
sync-chunk-writes=true
view-distance=4
'''
        new File(gameDir, 'contracts.json').delete()
    }
    doLast {
        def report = file(providers.gradleProperty('contractGameDir').getOrElse('runs/contracts') + '/contracts.json')
        if (!report.exists() || new groovy.json.JsonSlurper().parse(report).success != true)
            throw new GradleException('Runtime contracts failed')
    }
}
def slashBladeCoordinate = 'maven.modrinth:8T53F0sy:cw0UX6eX'
dependencies {
    implementation slashBladeCoordinate
    slashbladeVerification slashBladeCoordinate
}
tasks.named('processResources') {
    inputs.property('mod_version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.version) }
}
tasks.register('verifyResolvedSlashBlade') {
    inputs.file('dependencies.sha256.json')
    inputs.files(configurations.slashbladeVerification)
    doLast {
        def expected = new groovy.json.JsonSlurper().parse(file('dependencies.sha256.json'))[0]
        def resolved = configurations.slashbladeVerification.files as List
        if (resolved.size() != 1) throw new GradleException("Expected one SlashBlade artifact, resolved ${resolved.size()}")
        def artifact = resolved[0]
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
        if (expected.coordinate != slashBladeCoordinate || actual != expected.sha256 || artifact.length() != expected.size)
            throw new GradleException('SlashBlade dependency identity mismatch')
    }
}
tasks.withType(JavaCompile).configureEach {
    dependsOn 'verifyResolvedSlashBlade'
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def bundledNotices = files('LICENSE', 'NOTICE', 'THIRD-PARTY-NOTICES.md',
        'LICENSE-LEGACY-README.txt', 'LICENSE-LEGACY17-README.txt', 'AI-GENERATED.md')
tasks.named('jar') { from(bundledNotices) { into 'META-INF/licenses' } }
tasks.named('sourcesJar') { from(bundledNotices) { into 'META-INF/licenses' } }
